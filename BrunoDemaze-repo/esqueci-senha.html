<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esqueci a senha</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="btn-voltar" onclick="history.back()">
Voltar
</div>

<section class="auth-container">
<form class="auth-box" id="recuperar-senha-form" novalidate>
<h2>Esqueci a senha</h2>

<div id="etapa-email">
    <input id="recuperacao-email" type="email" placeholder="Email" autocomplete="email" required>
    <button class="btn-amarelo" id="enviar-codigo" type="button">Enviar código de verificação</button>
</div>

<div id="etapa-codigo" hidden>
    <input id="recuperacao-codigo" type="text" inputmode="numeric" maxlength="6" placeholder="Código de verificação" required>
    <button class="btn-amarelo" id="verificar-codigo" type="button">Verificar código</button>
</div>

<div id="etapa-senha" hidden>
    <div class="password-wrapper">
        <input id="nova-senha" type="password" placeholder="Nova senha" autocomplete="new-password" required>
        <button type="button" class="toggle-password" data-target="nova-senha" aria-label="Mostrar senha">
            <span class="eye-icon" aria-hidden="true"></span>
        </button>
    </div>
    <div class="password-wrapper">
        <input id="confirmar-nova-senha" type="password" placeholder="Confirmar nova senha" autocomplete="new-password" required>
        <button type="button" class="toggle-password" data-target="confirmar-nova-senha" aria-label="Mostrar senha">
            <span class="eye-icon" aria-hidden="true"></span>
        </button>
    </div>
    <button class="btn-amarelo" id="alterar-senha" type="submit">Alterar senha</button>
</div>

<p class="auth-link">
Lembrou a senha? <a href="login.html">Entrar</a>
</p>
</form>
</section>

<div class="status-popup" id="status-popup"></div>

<script>
const form = document.getElementById("recuperar-senha-form");
const statusPopup = document.getElementById("status-popup");
const etapaEmail = document.getElementById("etapa-email");
const etapaCodigo = document.getElementById("etapa-codigo");
const etapaSenha = document.getElementById("etapa-senha");
const emailInput = document.getElementById("recuperacao-email");
const codigoInput = document.getElementById("recuperacao-codigo");
const novaSenhaInput = document.getElementById("nova-senha");
const confirmarNovaSenhaInput = document.getElementById("confirmar-nova-senha");
const enviarCodigoButton = document.getElementById("enviar-codigo");
const verificarCodigoButton = document.getElementById("verificar-codigo");

let emailRecuperacao = "";
let codigoVerificado = "";

function showPopup(message, isError = false) {
    statusPopup.textContent = message;
    statusPopup.classList.toggle("is-error", isError);
    statusPopup.classList.add("is-visible");

    clearTimeout(showPopup.timeoutId);
    showPopup.timeoutId = setTimeout(() => {
        statusPopup.classList.remove("is-visible");
    }, 4500);
}

function mostrarEtapa(etapa) {
    etapaEmail.hidden = etapa !== "email";
    etapaCodigo.hidden = etapa !== "codigo";
    etapaSenha.hidden = etapa !== "senha";
}

const eyeOpenIcon = `
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
    </svg>
`;
const eyeClosedIcon = `
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M3 3l18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M10.6 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a18.8 18.8 0 0 1-3.2 4.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M6.6 6.7C3.6 8.7 2 12 2 12s3.5 7 10 7c1.8 0 3.3-.5 4.6-1.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
`;

document.querySelectorAll(".toggle-password").forEach((button) => {
    const icon = button.querySelector(".eye-icon");

    if (icon) {
        icon.innerHTML = eyeOpenIcon;
    }

    button.addEventListener("click", () => {
        const targetId = button.getAttribute("data-target");
        const input = document.getElementById(targetId);
        const icon = button.querySelector(".eye-icon");

        if (!input || !icon) return;

        const senhaVisivel = input.type === "text";
        input.type = senhaVisivel ? "password" : "text";
        button.classList.toggle("is-visible", !senhaVisivel);
        button.setAttribute("aria-label", senhaVisivel ? "Mostrar senha" : "Ocultar senha");
        icon.innerHTML = senhaVisivel ? eyeOpenIcon : eyeClosedIcon;
    });
});

async function enviarCodigo() {
    const email = emailInput.value.trim();

    if (!email) {
        showPopup("Informe o email.", true);
        return;
    }

    enviarCodigoButton.disabled = true;

    try {
        const resposta = await fetch("/auth/forgot-password/send-code", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email })
        });

        const data = await resposta.json().catch(() => ({}));

        if (!resposta.ok) {
            console.error("Erro ao enviar código de recuperação:", resposta.status, data);
            showPopup(data.erro || "Não foi possível enviar o código.", true);
            return;
        }

        emailRecuperacao = email;
        codigoVerificado = "";

        if (data.codigo_teste) {
            alert("Código de recuperação para teste: " + data.codigo_teste);
            showPopup("Código gerado. Cole no campo de verificação.");
        } else {
            showPopup("Código enviado para o email.");
        }

        mostrarEtapa("codigo");
        codigoInput.focus();
    } catch (error) {
        console.error("Erro de conexão ao enviar código:", error);
        showPopup("Erro ao conectar com o servidor. Tente novamente.", true);
    } finally {
        enviarCodigoButton.disabled = false;
    }
}

async function verificarCodigo() {
    const codigo = codigoInput.value.trim();

    if (!emailRecuperacao) {
        mostrarEtapa("email");
        showPopup("Informe o email novamente.", true);
        return;
    }

    if (!codigo) {
        showPopup("Informe o código de verificação.", true);
        return;
    }

    verificarCodigoButton.disabled = true;

    try {
        const resposta = await fetch("/auth/forgot-password/verify-code", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: emailRecuperacao,
                codigo
            })
        });

        const data = await resposta.json().catch(() => ({}));

        if (!resposta.ok) {
            console.error("Erro ao verificar código de recuperação:", resposta.status, data);
            showPopup(data.erro || "Código inválido.", true);
            return;
        }

        codigoVerificado = codigo;
        showPopup("Código verificado com sucesso.");
        mostrarEtapa("senha");
        novaSenhaInput.focus();
    } catch (error) {
        console.error("Erro de conexão ao verificar código:", error);
        showPopup("Erro ao conectar com o servidor. Tente novamente.", true);
    } finally {
        verificarCodigoButton.disabled = false;
    }
}

async function alterarSenha(event) {
    event.preventDefault();

    const novaSenha = novaSenhaInput.value;
    const confirmarNovaSenha = confirmarNovaSenhaInput.value;

    if (!codigoVerificado) {
        mostrarEtapa("codigo");
        showPopup("Verifique o código antes de alterar a senha.", true);
        return;
    }

    if (novaSenha.length < 6) {
        showPopup("A nova senha deve ter pelo menos 6 caracteres.", true);
        return;
    }

    if (novaSenha !== confirmarNovaSenha) {
        showPopup("As senhas não conferem.", true);
        return;
    }

    try {
        const resposta = await fetch("/auth/forgot-password/reset", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: emailRecuperacao,
                codigo: codigoVerificado,
                nova_senha: novaSenha
            })
        });

        const data = await resposta.json().catch(() => ({}));

        if (!resposta.ok) {
            console.error("Erro ao alterar senha:", resposta.status, data);
            showPopup(data.erro || "Não foi possível alterar a senha.", true);
            return;
        }

        showPopup(data.msg || "Senha alterada com sucesso.");

        setTimeout(() => {
            window.location.href = "login.html";
        }, 1200);
    } catch (error) {
        console.error("Erro de conexão ao alterar senha:", error);
        showPopup("Erro ao conectar com o servidor. Tente novamente.", true);
    }
}

enviarCodigoButton.addEventListener("click", enviarCodigo);
verificarCodigoButton.addEventListener("click", verificarCodigo);
form.addEventListener("submit", alterarSenha);
mostrarEtapa("email");
</script>

</body>
</html>
