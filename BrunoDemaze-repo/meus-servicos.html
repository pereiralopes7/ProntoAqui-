<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meus Serviços</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="btn-voltar" onclick="history.back()">← Voltar</div>

<section class="pagina-servicos">
<h1 id="titulo-servicos">Meus serviços contratados</h1>
<p class="subtitulo" id="subtitulo-servicos">Acompanhe os serviços que você contratou.</p>

<div id="lista-servicos" class="lista-servicos"></div>
</section>

<script>
const token = localStorage.getItem('token')

const tituloServicos = document.getElementById('titulo-servicos')
const subtituloServicos = document.getElementById('subtitulo-servicos')
const container = document.getElementById('lista-servicos')

let usuarioLogado = null
let solicitacoesAtuais = []
let usuarioPrestador = false
const FOTO_PADRAO = '/img/default-user.svg'

function escaparHtml(valor) {
    return String(valor || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;')
}

function formatarData(dataIso) {
    if (!dataIso) return ''
    const data = new Date(dataIso)
    if (Number.isNaN(data.getTime())) return ''
    return data.toLocaleString('pt-BR', {
        day: '2-digit',
        month: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
    })
}

function gerarIdConversa(a, b) {
    const ids = [Number(a), Number(b)].sort((x, y) => x - y)
    return `chat_${ids[0]}_${ids[1]}`
}

function textoStatus(status) {
    if (status === 'finalizacao_liberada') {
        return usuarioPrestador ? 'Finalização liberada para o consumidor.' : 'Finalização liberada pelo prestador.'
    }
    if (status === 'finalizado') return 'Serviço finalizado com sucesso.'
    return 'Negociação em andamento.'
}

async function carregarUsuarioLogado() {
    if (!token) {
        window.location.href = 'login.html'
        return null
    }

    const response = await fetch('/usuario/me', {
        headers: { Authorization: `Bearer ${token}` }
    })
    const data = await response.json().catch(() => ({}))

    if (!response.ok) {
        window.location.href = 'login.html'
        return null
    }

    return data
}

async function carregarSolicitacoes() {
    if (usuarioPrestador) {
        tituloServicos.textContent = 'Solicitações em andamento'
        subtituloServicos.textContent = 'Acompanhe conversas, negociações e serviços com consumidores.'
    } else {
        tituloServicos.textContent = 'Contatos'
        subtituloServicos.textContent = 'Acompanhe suas conversas com prestadores.'
    }

    container.innerHTML = '<div class="empty-state">Carregando solicitações...</div>'

    try {
        const response = await fetch('/chat/minhas-solicitacoes', {
            headers: { Authorization: `Bearer ${token}` }
        })
        const data = await response.json().catch(() => ({}))

        if (!response.ok) {
            console.error('Erro ao carregar solicitações:', response.status, data)
            container.innerHTML = `<div class="empty-state">${escaparHtml(data.erro || 'Não foi possível carregar as solicitações.')}</div>`
            return
        }

        const solicitacoes = data.solicitacoes || []
        solicitacoesAtuais = solicitacoes

        if (!solicitacoes.length) {
            container.innerHTML = usuarioPrestador
                ? '<div class="empty-state">Nenhuma solicitação em andamento.</div>'
                : '<div class="empty-state">Nenhum contato encontrado ainda.</div>'
            return
        }

        container.innerHTML = solicitacoes.map((solicitacao) => `
            <div class="servico-item">
                <img
                    class="profissional-foto"
                    src="${escaparHtml(solicitacao.foto_perfil || FOTO_PADRAO)}"
                    alt="Foto de ${escaparHtml(solicitacao.outro_usuario_nome)}"
                    style="object-position: 50% ${Number(solicitacao.foto_posicao_y || 50)}%;"
                    onerror="this.onerror=null; this.src=FOTO_PADRAO;"
                >
                <h3>${escaparHtml(solicitacao.outro_usuario_nome)}</h3>
                ${solicitacao.profissao ? `<p>Profissão: ${escaparHtml(solicitacao.profissao)}</p>` : ''}
                <p>Última mensagem: "${escaparHtml(solicitacao.ultima_mensagem)}"</p>
                <p>Status: ${textoStatus(solicitacao.status_servico)}</p>
                <p>${formatarData(solicitacao.data_ultima_mensagem)}</p>
                <button class="btn-amarelo abrir-conversa-btn" type="button" data-outro-id="${solicitacao.outro_usuario_id}">Abrir conversa</button>
            </div>
        `).join('')
    } catch (error) {
        console.error('Erro ao carregar solicitações:', error)
        container.innerHTML = '<div class="empty-state">Erro ao conectar com o servidor.</div>'
    }
}

function abrirConversa(solicitacao) {
    const outroUsuarioId = Number(solicitacao.outro_usuario_id)
    const conversaId = solicitacao.conversa_id || gerarIdConversa(usuarioLogado.id, outroUsuarioId)
    const nome = solicitacao.outro_usuario_nome || 'Conversa'
    const url = new URL('conversa.html', window.location.href)

    url.searchParams.set('conversa_id', conversaId)
    url.searchParams.set('usuario_id', String(outroUsuarioId))
    url.searchParams.set('nome', nome)

    window.location.href = url.pathname + url.search
}

container.addEventListener('click', (event) => {
    const botao = event.target.closest('.abrir-conversa-btn')

    if (!botao) return

    const consumidorId = Number(botao.dataset.outroId)
    const solicitacao = solicitacoesAtuais.find((item) => Number(item.outro_usuario_id) === consumidorId)

    if (!solicitacao) return

    abrirConversa(solicitacao)
})

async function iniciar() {
    usuarioLogado = await carregarUsuarioLogado()

    if (!usuarioLogado) return

    const tipoAtual = usuarioLogado.tipo_usuario || usuarioLogado.tipo || ''
    usuarioPrestador = tipoAtual === 'contratado' || tipoAtual === 'prestador'
    await carregarSolicitacoes()
}

iniciar()
</script>

</body>
</html>
