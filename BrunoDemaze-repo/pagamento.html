<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento do serviço</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>

<div class="btn-voltar" onclick="history.back()">← Voltar</div>

<main class="pagamento-container">
<section class="perfil-card pagamento-card">
    <h1>Pagamento do serviço</h1>
    <p class="subtitulo">Escaneie o QR Code para realizar o pagamento.</p>

    <div id="pagamento-mensagem" class="pagamento-mensagem" role="status"></div>

    <div id="pagamento-dados" class="pagamento-dados">
        <p>Carregando dados do pagamento...</p>
    </div>

    <div id="qrcode" class="qrcode-box" aria-label="QR Code do pagamento"></div>

    <label class="codigo-pagamento-label" for="codigo-pagamento-texto">
        Dados para pagamento
    </label>
    <textarea id="codigo-pagamento-texto" readonly placeholder="Os dados do pagamento aparecerão aqui."></textarea>

    <button class="btn-secundario pagamento-copiar" id="copiar-pagamento" type="button" disabled>
        Copiar dados do pagamento
    </button>

    <p class="texto-apoio">
        Este QR Code é uma simulação para apresentação. A integração Pix real será implementada futuramente.
    </p>

    <button class="btn-amarelo pagamento-confirmar" id="confirmar-pagamento" type="button" disabled>
        Confirmar pagamento e finalizar serviço
    </button>
    <button class="btn-secundario pagamento-voltar" type="button" onclick="history.back()">Voltar</button>
</section>
</main>

<script>
const token = localStorage.getItem('token')
const params = new URLSearchParams(window.location.search)
const conversaId = params.get('conversa_id')
const dadosContainer = document.getElementById('pagamento-dados')
const confirmarBtn = document.getElementById('confirmar-pagamento')
const copiarBtn = document.getElementById('copiar-pagamento')
const qrcodeContainer = document.getElementById('qrcode')
const codigoPagamentoTexto = document.getElementById('codigo-pagamento-texto')
const mensagemPagamento = document.getElementById('pagamento-mensagem')

let pagamentoAtual = null
let textoPagamento = ''

function escaparHtml(valor) {
    return String(valor || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;')
}

function textoOuPadrao(valor, padrao) {
    const texto = String(valor || '').trim()
    return texto || padrao
}

function formatarMoeda(valor) {
    const numero = Number(String(valor || '').replace(',', '.'))

    if (!Number.isFinite(numero)) {
        return 'Valor não informado'
    }

    return numero.toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
    })
}

function mostrarMensagem(mensagem, erro = false) {
    mensagemPagamento.textContent = mensagem
    mensagemPagamento.classList.toggle('is-error', erro)
}

function mostrarErro(mensagem) {
    mostrarMensagem(mensagem, true)
    dadosContainer.innerHTML = `<p>${escaparHtml(mensagem)}</p>`
    qrcodeContainer.innerHTML = '<p>Não foi possível gerar o QR Code.</p>'
    codigoPagamentoTexto.value = ''
    copiarBtn.disabled = true
    confirmarBtn.disabled = true
}

function montarTextoPagamento(dados) {
    const nomeRecebedor = textoOuPadrao(dados.nome_recebedor, 'Recebedor não informado')
    const tipoChavePix = textoOuPadrao(dados.tipo_chave_pix, 'Tipo da chave Pix não informado')
    const chavePix = textoOuPadrao(dados.chave_pix, '')
    const valorFormatado = formatarMoeda(dados.valor_servico)
    const descricaoPagamento = textoOuPadrao(dados.descricao_pagamento, 'Pagamento de serviço pelo ProntoAqui')

    return [
        'ProntoAqui - Pagamento de serviço',
        `Recebedor: ${nomeRecebedor}`,
        `Tipo da chave Pix: ${tipoChavePix}`,
        `Chave Pix: ${chavePix}`,
        `Valor: ${valorFormatado}`,
        `Descrição: ${descricaoPagamento}`,
        `Conversa: ${dados.conversa_id}`
    ].join('\n')
}

function validarDadosParaQrCode(dados) {
    if (!String(dados.nome_recebedor || '').trim()) {
        return 'Recebedor não informado pelo prestador.'
    }

    if (!String(dados.valor_servico || '').trim()) {
        return 'Valor não informado pelo prestador.'
    }

    if (!String(dados.chave_pix || '').trim()) {
        return 'Chave Pix não informada pelo prestador.'
    }

    return ''
}

function gerarQrCode() {
    qrcodeContainer.innerHTML = ''

    if (typeof QRCode === 'undefined') {
        qrcodeContainer.innerHTML = '<p>Erro ao carregar gerador de QR Code. Verifique a conexão.</p>'
        mostrarMensagem('Erro ao carregar gerador de QR Code. Verifique a conexão.', true)
        return
    }

    try {
        new QRCode(qrcodeContainer, {
            text: textoPagamento,
            width: 220,
            height: 220,
            colorDark: '#000000',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H
        })
    } catch (error) {
        console.error('Erro ao gerar QR Code:', error)
        qrcodeContainer.innerHTML = '<p>Não foi possível gerar o QR Code.</p>'
        mostrarMensagem('Não foi possível gerar o QR Code.', true)
    }
}

function renderizarPagamento(dados) {
    pagamentoAtual = dados

    const nomeRecebedor = textoOuPadrao(dados.nome_recebedor, 'Recebedor não informado')
    const tipoChavePix = textoOuPadrao(dados.tipo_chave_pix, 'Tipo da chave Pix não informado')
    const chavePix = textoOuPadrao(dados.chave_pix, 'Chave Pix não informada')
    const descricaoPagamento = textoOuPadrao(dados.descricao_pagamento, 'Pagamento de serviço pelo ProntoAqui')
    const valorFormatado = formatarMoeda(dados.valor_servico)

    dadosContainer.innerHTML = `
        <p><strong>Recebedor:</strong> ${escaparHtml(nomeRecebedor)}</p>
        <p><strong>Valor:</strong> ${escaparHtml(valorFormatado)}</p>
        <p><strong>Tipo da chave Pix:</strong> ${escaparHtml(tipoChavePix)}</p>
        <p><strong>Chave Pix:</strong> ${escaparHtml(chavePix)}</p>
        <p><strong>Descrição:</strong> ${escaparHtml(descricaoPagamento)}</p>
    `

    textoPagamento = montarTextoPagamento(dados)
    codigoPagamentoTexto.value = textoPagamento
    copiarBtn.disabled = false

    const erroValidacao = validarDadosParaQrCode(dados)

    if (erroValidacao) {
        qrcodeContainer.innerHTML = '<p>Não foi possível gerar o QR Code.</p>'
        mostrarMensagem(erroValidacao, true)
        confirmarBtn.disabled = true
        return
    }

    mostrarMensagem('')
    gerarQrCode()

    confirmarBtn.disabled = dados.status === 'finalizado'
    confirmarBtn.textContent = dados.status === 'finalizado'
        ? 'Serviço finalizado com sucesso'
        : 'Confirmar pagamento e finalizar serviço'
}

async function carregarPagamento() {
    if (!token) {
        window.location.href = 'login.html'
        return
    }

    if (!conversaId) {
        mostrarErro('Conversa não informada.')
        return
    }

    const response = await fetch(`/pagamento/dados/${encodeURIComponent(conversaId)}`, {
        headers: { Authorization: `Bearer ${token}` }
    })
    const data = await response.json().catch(() => ({}))

    if (!response.ok) {
        console.error('Erro ao carregar pagamento:', response.status, data)
        mostrarErro(data.erro || 'Não foi possível carregar os dados do pagamento.')
        return
    }

    renderizarPagamento(data)
}

async function copiarDadosPagamento() {
    if (!textoPagamento) {
        mostrarMensagem('Não há dados de pagamento para copiar.', true)
        return
    }

    try {
        await navigator.clipboard.writeText(textoPagamento)
        mostrarMensagem('Dados do pagamento copiados com sucesso.')
        return
    } catch (error) {
        console.error('Erro ao copiar dados:', error)
    }

    try {
        const textarea = document.createElement('textarea')
        textarea.value = textoPagamento
        textarea.setAttribute('readonly', '')
        textarea.style.position = 'fixed'
        textarea.style.left = '-9999px'
        document.body.appendChild(textarea)
        textarea.select()
        document.execCommand('copy')
        document.body.removeChild(textarea)
        mostrarMensagem('Dados do pagamento copiados com sucesso.')
    } catch (fallbackError) {
        console.error('Erro no fallback de cópia:', fallbackError)
        mostrarMensagem('Não foi possível copiar os dados. Copie manualmente as informações exibidas na tela.', true)
    }
}

copiarBtn.addEventListener('click', copiarDadosPagamento)

confirmarBtn.addEventListener('click', async () => {
    if (!pagamentoAtual || confirmarBtn.disabled) return

    const response = await fetch('/pagamento/confirmar', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${token}`
        },
        body: JSON.stringify({ conversa_id: pagamentoAtual.conversa_id })
    })
    const data = await response.json().catch(() => ({}))

    if (!response.ok) {
        console.error('Erro ao confirmar pagamento:', response.status, data)
        mostrarMensagem(data.erro || 'Não foi possível confirmar o pagamento.', true)
        return
    }

    confirmarBtn.disabled = true
    confirmarBtn.textContent = 'Serviço finalizado com sucesso'
    mostrarMensagem('Pagamento confirmado e serviço finalizado com sucesso.')
})

carregarPagamento()
</script>

</body>
</html>
