<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="btn-voltar" onclick="history.back()">
Voltar
</div>

<section class="auth-container">
<form class="auth-box" id="login-form">
<h2>Entrar</h2>

<input id="login-email" type="email" placeholder="Email" required>
<div class="password-wrapper">
    <input id="login-senha" type="password" placeholder="Senha" required>
    <button type="button" class="toggle-password" data-target="login-senha" aria-label="Mostrar senha">
        <span class="eye-icon" aria-hidden="true"></span>
    </button>
</div>

<button class="btn-amarelo" type="submit">Entrar</button>

<p class="auth-link">
<a href="esqueci-senha.html">Esqueci a senha</a>
</p>

<p class="auth-link">
Não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
</p>
</form>
</section>
<div class="status-popup" id="status-popup"></div>
<script>
const loginForm = document.getElementById("login-form");
const statusPopup = document.getElementById("status-popup");

function showPopup(message, isError = false) {
    statusPopup.textContent = message;
    statusPopup.classList.toggle("is-error", isError);
    statusPopup.classList.add("is-visible");

    setTimeout(() => {
        statusPopup.classList.remove("is-visible");
    }, 2200);
}

const eyeOpenIcon = `
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
    </svg>
`;
const eyeClosedIcon = `
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M3 3l18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M10.6 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a18.8 18.8 0 0 1-3.2 4.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M6.6 6.7C3.6 8.7 2 12 2 12s3.5 7 10 7c1.8 0 3.3-.5 4.6-1.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
`;

document.querySelectorAll(".toggle-password").forEach((button) => {
    const icon = button.querySelector(".eye-icon");

    if (icon) {
        icon.innerHTML = eyeOpenIcon;
    }

    button.addEventListener("click", () => {
        const targetId = button.getAttribute("data-target");
        const input = document.getElementById(targetId);
        const icon = button.querySelector(".eye-icon");

        if (!input || !icon) return;

        const senhaVisivel = input.type === "text";
        input.type = senhaVisivel ? "password" : "text";
        button.classList.toggle("is-visible", !senhaVisivel);
        button.setAttribute("aria-label", senhaVisivel ? "Mostrar senha" : "Ocultar senha");
        icon.innerHTML = senhaVisivel ? eyeOpenIcon : eyeClosedIcon;
    });
});

loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.getElementById("login-email").value.trim();
    const senha = document.getElementById("login-senha").value;

    try {

        // DEFINE A ROTA AUTOMATICAMENTE
        const rota = email.includes("admin")
            ? "/auth/admin/login"
            : "/auth/login";

        const resposta = await fetch(rota, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, senha })
        });

        const data = await resposta.json().catch(() => ({}));

        if (!resposta.ok) {
            console.error("Erro no login:", resposta.status, data);
            showPopup(data.erro || "Não foi possível fazer login.", true);
            return;
        }

        // SALVA DADOS
        localStorage.setItem("token", data.token);
        localStorage.setItem("usuario", JSON.stringify(data));
        localStorage.setItem("tipo_usuario", data.tipo);

        showPopup("Login realizado com sucesso!");

        // REDIRECIONA
        setTimeout(() => {

            if (data.tipo === "admin") {
                window.location.href = "admin.html";
            } else {
                window.location.href = "index.html";
            }

        }, 900);

    } catch (error) {
        console.error("Erro de conexão no login:", error);
        showPopup("Erro ao conectar com o servidor. Tente novamente.", true);
    }
});
</script>

</body>
</html>
